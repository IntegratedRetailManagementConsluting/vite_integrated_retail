	function safeRedirect(targetUrl) {
    if (!targetUrl || targetUrl === '#' || targetUrl.startsWith('javascript')) return;

    try {
        // --- 核心修复：清理末尾的 JSON 干扰符 ---
        // 只要遇到引号、括号、大括号，就立刻切断，只留前面的网址
        let cleanUrl = targetUrl.replace(/\\/g, ''); // 先去反斜杠
        const urlMatch = cleanUrl.match(/https?:\/\/[^\s"“'”’\}）\]]+/); 
        if (urlMatch) {
            cleanUrl = urlMatch[0];
        }

        const currentParams = new URLSearchParams(window.location.search);
        const newUrl = new URL(cleanUrl);

        // 核心：把当前的 firstname, email 等参数带过去
        currentParams.forEach((value, key) => {
            newUrl.searchParams.set(key, value);
        });

        console.log("🚀 最终跳转地址:", newUrl.toString());
        // 覆盖整个浏览器标签页
        window.top.location.href = newUrl.toString();
    } catch (e) {
        console.error("Redirect Error:", e);
        // 兜底：如果解析失败，暴力去掉非网址字符后跳转
        window.top.location.href = targetUrl.replace(/[^\x21-\x7E]+/g, '').split(/[算法"'}）]/)[0];
    }
}

	 window.botpress.on('webchat:ready', () => {
        console.log("🤖 Botpress 已就绪，深度监听器启动...");
        window.botpress.open();

        // 【核心修改】深度拦截逻辑
        window.botpress.on('*', (event) => {
            console.log("🔍 捕捉事件:", event.type, event.payload);

            let extractedUrl = null;
            const p = event.payload;

            // 路径 1: 直接在 payload 里 (Open URL 模式)
            if (p?.url) extractedUrl = p.url;
            
            // 路径 2: 嵌套在 payload.payload 里 (Postback 模式)
            else if (p?.payload) {
                if (typeof p.payload === 'string' && p.payload.includes('{')) {
                    try {
                        const inner = JSON.parse(p.payload);
                        extractedUrl = inner.url;
                    } catch (e) { }
                } 
                else if (typeof p.payload === 'string' && p.payload.includes('http')) {
                    extractedUrl = p.payload;
                }
                else if (p.payload.url) {
                    extractedUrl = p.payload.url;
                }
            }

            // 路径 3: 暴力扫描
            if (!extractedUrl && p) {
                const strPayload = JSON.stringify(p);
                if (strPayload.includes('integrated')) {
                    const match = strPayload.match(/https?:\/\/[^\s"']+/);
                    if (match) extractedUrl = match[0]; 
                }
            }

            // 执行跳转
            if (extractedUrl && extractedUrl.includes('integrated')) {
                console.log("🎯 成功截获目标 URL:", extractedUrl);
                safeRedirect(extractedUrl);
            }
        });
